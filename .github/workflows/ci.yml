name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  # ---------------------------------------------------------------- static
  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  secrets-guard:
    name: secrets-guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: .env.example must contain keys only
        run: |
          if grep -nE '^[A-Za-z_][A-Za-z0-9_]*=.+' .env.example; then
            echo "::error::.env.example must not contain values"
            exit 1
          fi
          echo "OK — .env.example has no values"

      - name: no secret-bearing NEXT_PUBLIC_ variable
        run: |
          if grep -rnE 'NEXT_PUBLIC_[A-Z0-9_]*(SECRET|KEY|TOKEN|PASSWORD)' \
               --include='*.ts' --include='*.tsx' --include='*.js' --include='*.mjs' . \
               --exclude-dir=node_modules --exclude-dir=.next; then
            echo "::error::a NEXT_PUBLIC_ variable appears to hold a secret"
            exit 1
          fi
          echo "OK — no secret-bearing NEXT_PUBLIC_ variable"

      - name: scan history for leaked credentials
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ---------------------------------------------------------------- tests
  test-unit:
    name: test-unit
    runs-on: ubuntu-latest
    needs: [typecheck]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:unit

  # Phase 1 adds: test-integration (real Postgres, RLS, T4 tenant isolation).
  # Phase 5 adds: test-e2e (Playwright) and the real-device offline gate.
  # Neither is defined yet because neither suite exists yet — a job that
  # always passes would be worse than no job at all.

  # ---------------------------------------------------------------- build
  build:
    name: build
    runs-on: ubuntu-latest
    needs: [typecheck, lint]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # --webpack is MANDATORY. Turbopack exits 0 while emitting no service
      # worker, which would silently remove all offline capability (ADR-0008).
      - run: pnpm build

      - name: PWA service-worker guard
        run: pnpm pwa:guard

      - uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: .next/
          retention-days: 3

  # ---------------------------------------------------------------- gate
  ci-ok:
    name: ci-ok
    runs-on: ubuntu-latest
    needs: [typecheck, lint, secrets-guard, test-unit, build]
    if: always()
    steps:
      - name: Fail if any job failed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
      - name: All checks passed
        run: echo "ci-ok"
